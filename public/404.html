<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #07060e; --card: #12111d;
    --border: #2a2650; --pink: #ff6b9d; --cyan: #00e5ff;
    --cream: #f0ebd8; --text-dim: #7a7590;
    --font-pixel: 'Press Start 2P', monospace;
    --font-body: 'Noto Sans TC', sans-serif;
  }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--cream);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
  }
  canvas#bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .container {
    position: relative;
    z-index: 1;
    padding: 2rem 2.5rem;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: rgba(18, 17, 29, 0.85);
    max-width: 400px;
    width: 90%;
  }
  .code {
    font-family: var(--font-pixel);
    font-size: clamp(2.5rem, 15vw, 4.5rem);
    color: var(--pink);
    text-shadow: 0 0 20px rgba(255, 107, 157, 0.5);
    line-height: 1;
    margin-bottom: 0.4em;
  }
  .subtitle {
    font-family: var(--font-pixel);
    font-size: 0.6rem;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    margin-bottom: 1.5rem;
  }
  .emoji { font-size: 2.5rem; margin-bottom: 1rem; display: block; }
  .msg {
    font-size: 0.95rem;
    color: var(--text-dim);
    line-height: 1.8;
    margin-bottom: 1.8rem;
  }
  .home-btn {
    display: inline-block;
    font-family: var(--font-pixel);
    font-size: 0.6rem;
    color: var(--cyan);
    border: 1px solid var(--cyan);
    border-radius: 8px;
    padding: 0.75em 1.4em;
    text-decoration: none;
    letter-spacing: 0.08em;
    transition: background 0.2s, color 0.2s;
  }
  .home-btn:hover {
    background: var(--cyan);
    color: var(--bg);
  }
</style>

<script>
(function () {
  var canvas = document.getElementById('bg');
  var ctx = canvas.getContext('2d');
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  var stars = [];
  for (var i = 0; i < 60; i++) {
    stars.push({ x: Math.random(), y: Math.random(),
      size: Math.random() < 0.25 ? 2 : 1,
      speed: Math.random() * 0.1 + 0.04,
      phase: Math.random() * Math.PI * 2,
      twinkle: Math.random() * 0.015 + 0.004 });
  }
  function draw(time) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(function (s) {
      s.y += s.speed / canvas.height;
      if (s.y > 1) { s.y = 0; s.x = Math.random(); }
      var alpha = 0.2 + 0.3 * Math.sin(time * s.twinkle + s.phase);
      var colors = ['255,255,255', '200,180,255', '180,230,255'];
      ctx.fillStyle = 'rgba(' + colors[Math.floor(s.x * 3) % 3] + ',' + alpha.toFixed(2) + ')';
      ctx.fillRect(Math.floor(s.x * canvas.width), Math.floor(s.y * canvas.height), s.size, s.size);
    });
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}());
</script>
