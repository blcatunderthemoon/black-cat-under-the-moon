<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5, viewport-fit=cover">
<title>黑貓樹洞 — Black Cat Under The Moon</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #07060e; color: #f0ebd8; font-family: 'Noto Sans TC', sans-serif;
    text-align: center; padding: 24px;
  }
  .box { max-width: 360px; line-height: 1.8; }
  h1 { font-size: 1.4rem; color: #ffe066; margin: 0 0 12px; }
  p { color: #a09c8c; font-size: 0.95rem; margin: 0 0 12px; }
  code { color: #bd93f9; background: rgba(189,147,249,0.1); padding: 2px 6px; }
  a { color: #bd93f9; }
  .loading-dots::after {
    content: '';
    animation: loading-dots 1.4s steps(4, end) infinite;
  }
  @keyframes loading-dots {
    0% { content: ''; }
    25% { content: '.'; }
    50% { content: '..'; }
    75% { content: '...'; }
  }
</style>
</head>
<body>
  <div class="box" id="content">
    <h1>🌙 載入中<span class="loading-dots" aria-hidden="true"></span></h1>
    <p>正在連接黑貓樹洞</p>
  </div>
<script>
(function () {
  function showHelp() {
    document.getElementById('content').innerHTML =
      '<h1>🌙 黑貓樹洞</h1>' +
      '<p>黑貓樹洞係 Next.js 頁面，需要完整開發伺服器。</p>' +
      '<p>請在專案目錄執行：<br><code>npm run dev</code></p>' +
      '<p>並用終端顯示的網址開啟（例如 <a href="/forum">/forum</a>）。</p>' +
      '<p><a href="/index.html">← 返回首頁</a></p>';
  }

  fetch('/api/forum/meta', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('api');
      window.location.replace('/forum');
    })
    .catch(showHelp);
})();
</script>
</body>
</html>
